services:
  # .NET API — contact form, health, interaction logging
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      - api_storage:/app/storage
    networks:
      - portfolio-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Static frontend served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: portfolio-frontend
    ports:
      - '3000:80'
    depends_on:
      - api
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  api_storage:

networks:
  portfolio-network:
    driver: bridge
