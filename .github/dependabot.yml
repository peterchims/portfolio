version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
      build-tooling:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
